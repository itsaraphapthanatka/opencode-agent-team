<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151B2B"/>
      <stop offset="1" stop-color="#090C14"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.5" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#2A3A5E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2A3A5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tileClip"><rect x="0" y="0" width="256" height="256" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="256" height="256" fill="url(#tileBg)"/>
    <rect width="256" height="256" fill="url(#tileGlow)"/>
    <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- spokes -->
  <g stroke="#38BDF8" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="56"/>
    <line x1="128" y1="128" x2="190.35" y2="92"/>
    <line x1="128" y1="128" x2="190.35" y2="164"/>
    <line x1="128" y1="128" x2="128" y2="200"/>
    <line x1="128" y1="128" x2="65.65" y2="164"/>
    <line x1="128" y1="128" x2="65.65" y2="92"/>
  </g>

  <!-- worker agent nodes -->
  <g fill="#CBD5E1">
    <circle cx="190.35" cy="92" r="11"/>
    <circle cx="190.35" cy="164" r="11"/>
    <circle cx="128" cy="200" r="11"/>
    <circle cx="65.65" cy="164" r="11"/>
    <circle cx="65.65" cy="92" r="11"/>
  </g>

  <!-- lead node (top) -->
  <circle cx="128" cy="56" r="14" fill="url(#accentA)"/>

  <!-- hub glow + hexagon core -->
  <circle cx="128" cy="128" r="30" fill="#3B82F6" opacity="0.35" filter="url(#soft)"/>
  <polygon points="128,102 150.52,115 150.52,141 128,154 105.48,141 105.48,115" fill="url(#accentA)"/>
  <circle cx="128" cy="128" r="6.5" fill="#F8FAFC" opacity="0.95"/>
</svg>
